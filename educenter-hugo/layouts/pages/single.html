{{ define "main" }}
{{ if .Params.bodypartial }}
  {{ partial .Params.bodypartial . }}
{{ else }}
  <section class="section">
    <div class="container">
      <div class="row">
        <div class="col-12">
          <div class="content">{{ .Content }}</div>
        </div>
      </div>
    </div>
  </section>
{{ end }}
{{ end }}
