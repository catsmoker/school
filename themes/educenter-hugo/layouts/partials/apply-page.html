<section class="section">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-lg-8">
        <div class="card border-primary rounded-0 hover-shadow mb-5">
          <div class="card-body p-4 p-md-5">
            <h2 class="card-title text-center mb-4">Formulaire de candidature</h2>
            <p class="text-center text-muted mb-4">Remplissez le formulaire ci-dessous. Tous les champs marqu&e9;s d'une ast&e9;risque (*) sont obligatoires.</p>
            <div class="demo-msg" id="demo-apply-msg" style="display:none;"></div>
            <form id="demo-apply-form" novalidate>
              <div class="form-row">
                <div class="form-group col-md-6 mb-3">
                  <label class="font-weight-bold">Nom et pr&eacute;nom <span class="text-danger">*</span></label>
                  <input type="text" class="form-control" id="demo-app-fullname" placeholder="Ex. Amine Benali" required>
                </div>
                <div class="form-group col-md-6 mb-3">
                  <label class="font-weight-bold">E-mail <span class="text-danger">*</span></label>
                  <input type="email" class="form-control" id="demo-app-email" placeholder="exemple@ecole-demo.ma" required>
                </div>
              </div>
              <div class="form-row">
                <div class="form-group col-md-6 mb-3">
                  <label class="font-weight-bold">T&eacute;l&eacute;phone <span class="text-danger">*</span></label>
                  <input type="tel" class="form-control" id="demo-app-phone" placeholder="+212 6 XX XX XX XX" required>
                </div>
                <div class="form-group col-md-6 mb-3">
                  <label class="font-weight-bold">CIN <span class="text-danger">*</span></label>
                  <input type="text" class="form-control" id="demo-app-cin" placeholder="AB123456" required>
                </div>
              </div>
              <div class="form-row">
                <div class="form-group col-md-6 mb-3">
                  <label class="font-weight-bold">Date de naissance <span class="text-danger">*</span></label>
                  <input type="date" class="form-control" id="demo-app-dob" required>
                </div>
                <div class="form-group col-md-6 mb-3">
                  <label class="font-weight-bold">Fili&egrave;re choisie <span class="text-danger">*</span></label>
                  <select class="form-control" id="demo-app-program" required>
                    <option value="">— Choisir une fili&egrave;re —</option>
                    <option>D&eacute;veloppement Digital</option>
                    <option>Gestion des Entreprises</option>
                    <option>Infographie</option>
                    <option>&Eacute;lectrom&eacute;canique des Syst&egrave;mes Automatis&e9;s</option>
                    <option>Art Culinaire — Cuisine</option>
                    <option>Comptabilit&eacute; des Entreprises</option>
                  </select>
                </div>
              </div>
              <div class="form-group mb-3">
                <label class="font-weight-bold">Niveau <span class="text-danger">*</span></label>
                <select class="form-control" id="demo-app-level" required>
                  <option value="">— Choisir un niveau —</option>
                  <option>Qualification</option>
                  <option>Technicien (T)</option>
                  <option>Technicien Sp&eacute;cialis&e9; (TS)</option>
                </select>
              </div>
              <div class="form-group mb-3">
                <label class="font-weight-bold">Pi&egrave;ces jointes (CV, CIN, dipl&ocirc;me)</label>
                <input type="file" class="form-control-file" id="demo-app-docs" multiple>
              </div>
              <div class="form-group mb-3 form-check">
                <input type="checkbox" class="form-check-input" id="demo-app-terms" required>
                <label class="form-check-label" for="demo-app-terms">
                  J'accepte les conditions d'utilisation (d&eacute;mo uniquement — aucune donn&e9;e r&eacute;elle n'est enregistr&e9;e).
                </label>
              </div>
              <div class="text-center">
                <button type="submit" class="btn btn-primary btn-lg px-4">Soumettre ma candidature</button>
              </div>
            </form>
          </div>
        </div>
        <div class="text-center">
          <p class="text-muted small">D&eacute;mo scolaire — aucune donn&e9;e n'est transmise &agrave; un serveur r&eacute;el.</p>
        </div>
      </div>
    </div>
  </div>
</section>
