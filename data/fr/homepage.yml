############################## about ##################################
about:
  enable : true
  title : "À propos de l'OFPPT"
  image : "images/about/about-us.jpg"
  content : "L'Office de la Formation Professionnelle et de la Promotion du Travail (OFPPT), créé en 1974, est le premier opérateur public marocain de formation. Il anticipe les besoins du marché et forme les jeunes aux métiers de l'industrie, du numérique, du tourisme, de la santé, de l'agriculture et des services.


  Avec des campus dans chaque région — dont les Cités des Métiers et des Compétences — l'OFPPT allie ateliers pratiques, stages en entreprise et équipements modernes pour préparer les stagiaires à l'emploi. "
  button:
    enable : true
    label : "En savoir plus"
    link : "about/"


