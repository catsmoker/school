######################## Success story #############################
success_story:
  enable : true
  bg_image : "images/backgrounds/success-story.jpg"
  title : "Histoires de réussites"
  content : "Des ateliers des ISTA aux Cités des Métiers et des Compétences, les lauréats OFPPT font tourner les usines, hôtels, hôpitaux, chantiers et entreprises tech du Maroc. Apprentissage par la pratique, formateurs experts et partenariats employeurs : la formation mène à l'emploi.
            
            
  La voie de l'avenir — depuis 1974."
  # video link
  video_link : "https://www.youtube-nocookie.com/embed/xm1uXLFNnUk"


