      content : "Des centaines d'établissements — ISTA et Cités des Métiers et des Compétences — et les services en ligne sur www.ofppt.ma."
      animation_in : "left"
      animation_out : "right"
      # available animation : left, right, up, down
      button:
        enable : true
        label : "Nous contacter"
        link : "contact/"


