{{ $data := index site.Data site.Language.Lang }}

{{ with $data.homepage.success_story }}
<section class="section bg-cover" data-background="{{ .bg_image | relURL }}">
  <div class="container">
    <div class="row">
      <div class="col-12 col-lg-6 success-video">
        <div class="success-video-embed">
          <iframe
            src="{{ .video_link | safeURL }}"
            title="Vidéo OFPPT — Histoires de réussites"
            loading="lazy"
            referrerpolicy="strict-origin-when-cross-origin"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
            allowfullscreen>
          </iframe>
        </div>
      </div>
      <div class="col-12 col-lg-6">
        <div class="bg-white p-5">
          <h2 class="section-title">{{ .title | markdownify }}</h2>
          <p>{{ .content | markdownify }}</p>
        </div>
      </div>
    </div>
  </div>
</section>
{{ end }}
